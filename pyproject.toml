[project]
name = "mergetrail"
version = "0.1.0"
description = "Open-source, agent-agnostic workspace for understanding and reviewing large pull requests."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Amit Ghosh" }]
keywords = ["git", "diff", "code-review", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.7",
    "typer>=0.12",
    "uvicorn>=0.53.0",
]

[project.scripts]
mergetrail = "mergetrail.cli:app"

[project.urls]
Homepage = "https://github.com/maverickamit/mergetrail"
Issues = "https://github.com/maverickamit/mergetrail/issues"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mergetrail"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
